name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v4.8.25-335"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: Validate ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The hardcore suite pins the hashes of shared runtime files to the
        # upstream publication receipt. This fork modifies those files (theme
        # work), so the receipt is expected to differ; restore 'hardcore' to
        # the matrix only after regenerating the receipt through
        # tools/Build-HardcorePublication335.ps1 against the pinned sources.
        suite: [runtime, quest-flow]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Lua 5.1 test runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Run validation suite
        shell: pwsh
        run: ./tools/Validate-All335.ps1 -Suite '${{ matrix.suite }}' -RequireLua

  release:
    name: Package RXPGuides and publish release
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Fetch all refs for localization checkout (orphan branch)
          fetch-depth: 0

      - name: Install Lua 5.1 test runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Resolve pinned localization commit
        id: localizations
        shell: bash
        run: |
          set -euo pipefail
          commit="$(tr -d '\r\n[:space:]' < LOCALIZATIONS.lock)"
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "LOCALIZATIONS.lock does not contain a full commit ID." >&2
            exit 1
          fi
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Check out pinned localization sources
        shell: bash
        run: |
          mkdir -p .release-localizations
          cd .release-localizations
          git init
          git remote add origin ${{ github.server_url }}/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ steps.localizations.outputs.commit }}
          git checkout FETCH_HEAD

      - name: Validate pinned locale artifacts against runtime
        shell: bash
        run: lua5.1 tools/validate-locale-artifacts.lua .release-localizations .

      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${MANUAL_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            echo "Release tags must start with 'v' and contain only letters, numbers, dots, underscores, or hyphens." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "archive=RXPGuides-${tag}.zip" >> "${GITHUB_OUTPUT}"

      - name: Create addon ZIP
        id: package
        shell: bash
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          set -euo pipefail

          # Preserve runtime assets and user docs, excluding developer-only
          # files through the release commit's .gitattributes export rules.
          git archive \
            --format=zip \
            --prefix=RXPGuides/ \
            --output="${ARCHIVE}" \
            "${GITHUB_SHA}"

          unzip -Z1 "${ARCHIVE}" > "${RUNNER_TEMP}/rxpguides-archive-entries.txt"

          if ! grep -Fxq "RXPGuides/RXPGuides.toc" "${RUNNER_TEMP}/rxpguides-archive-entries.txt"; then
            echo "Package validation failed: RXPGuides/RXPGuides.toc is missing." >&2
            exit 1
          fi

          if grep -Evq '^RXPGuides/' "${RUNNER_TEMP}/rxpguides-archive-entries.txt"; then
            echo "Package validation failed: an entry exists outside the RXPGuides folder." >&2
            exit 1
          fi

          echo "Created ${ARCHIVE}:"
          du -h "${ARCHIVE}"

      - name: Verify player archive dependencies and exclusions
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: ./tools/Test-ReleaseArchive335.ps1 -ArchivePath $env:ARCHIVE -Revision $env:GITHUB_SHA

      - name: Create optional locale ZIPs
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          bash ./tools/Build-LocalePackages335.sh \
            --source .release-localizations \
            --output .locale-release \
            --version "${TAG}" \
            --revision "${{ steps.localizations.outputs.commit }}"
          du -h .locale-release/*.zip

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload \
              "${TAG}" \
              "${ARCHIVE}" \
              .locale-release/*.zip \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create \
              "${TAG}" \
              "${ARCHIVE}" \
              .locale-release/*.zip \
              --target "${GITHUB_SHA}" \
              --title "RXPGuides ${TAG}" \
              --generate-notes \
              --repo "${GITHUB_REPOSITORY}"
          fi
