name: Validate 3.3.5 addon data

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Discard superseded runs on the same branch or pull request while retaining
# the complete validation suite for every current branch, PR, and tag revision.
concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Guides, quest flow, talents, and privacy
    # Match the release runner so case-sensitive path mistakes are caught on
    # ordinary pushes and pull requests instead of only after tagging.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Lua 5.1 test runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate runtime, guides, and localization loader
        shell: pwsh
        run: |
          ./tools/Validate-Runtime335.ps1 -RequireLua
          ./tools/Validate-Guides335.ps1
          ./tools/Validate-GuideTranslations335.ps1 -CoreOnly

      - name: Resolve pinned localization commit
        id: localizations
        shell: bash
        run: |
          set -euo pipefail
          commit="$(tr -d '\r\n[:space:]' < LOCALIZATIONS.lock)"
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "LOCALIZATIONS.lock does not contain a full commit ID." >&2
            exit 1
          fi
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Check out pinned localization sources
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.localizations.outputs.commit }}
          path: .release-localizations
          fetch-depth: 1
          persist-credentials: false

      # The localization branch distributes compiled artifacts, not compiler inputs.
      # Validate with this addon's libraries/loader, not stale tools in that branch.
      - name: Validate pinned locale artifacts against runtime
        shell: bash
        run: lua5.1 tools/validate-locale-artifacts.lua .release-localizations .

      - name: Validate locale release packaging
        shell: bash
        run: |
          set -euo pipefail
          bash ./tools/Build-LocalePackages335.sh \
            --source .release-localizations \
            --output .locale-release \
            --version v0-ci \
            --revision "${{ steps.localizations.outputs.commit }}"

      - name: Validate quest flow, talents, roadmap, and privacy
        shell: pwsh
        run: |
          ./tools/Validate-QuestFlow335.ps1
          ./tests/hardcore-upstream.ps1
          ./tests/hardcore-coordinates.ps1
          ./tests/hardcore-upstream-compatibility.ps1
          ./tests/hardcore-pets.ps1
          ./tests/hardcore-racial.ps1
          ./tests/hardcore-warlock.ps1
          ./tests/hardcore-travel.ps1
          ./tests/hardcore-ferries.ps1
          ./tests/hardcore-demons.ps1
          ./tests/hardcore-english-names.ps1
          ./tests/hardcore-publication-preflight.ps1
          ./tests/hardcore-locations.ps1
          python3 ./tests/hardcore_quest_facts.py
          if ($LASTEXITCODE -ne 0) { throw 'Hardcore quest facts failed.' }
          ./tools/Validate-HardcorePublication335.ps1
          ./tests/hardcore-publication.ps1
          ./tools/Validate-Talents335.ps1
          ./tools/Validate-Roadmap335.ps1
          ./tools/Validate-Privacy335.ps1
